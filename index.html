<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b2a55"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>خمّن الكلمة بالصورة</title>
<style>
:root{--bg1:#0b2a55;--bg2:#0e8c9a;--tile:#fff;--ink:#0b2a55;--gold:#ffc83d;--btn:#1fb6c4;--btn2:#0f7f8c;--ok:#2ecc71;--bad:#ff5d5d;--card:rgba(255,255,255,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:#fff;font-family:"Cairo","Noto Naskh Arabic",Tahoma,sans-serif;display:flex;justify-content:center;overflow:hidden}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:10px 14px 14px;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.btn{border:0;color:#fff;font:inherit;font-weight:700;background:var(--btn);border-radius:14px;padding:8px 12px;box-shadow:0 4px 0 var(--btn2);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn2)}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 4px 0 #c28f00}
.btn:disabled{opacity:.5}
.pic{flex:1;min-height:0;background:var(--card);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:min(34vh,150px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.slots,.keys{display:grid;gap:8px;justify-content:center}
.slots{grid-auto-flow:column}
.slot,.key{width:44px;height:48px;border-radius:12px;background:var(--tile);color:var(--ink);font:inherit;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;border:0}
.slot{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.slot.f{background:var(--tile);color:var(--ink)}
.slot.lock{background:var(--gold);color:#5a3b00}
.keys{grid-template-columns:repeat(4,56px);gap:10px}
.key{width:56px;height:56px;box-shadow:0 4px 0 #aab8c8;cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:none}
.key.used{visibility:hidden}
.row{display:flex;gap:8px;justify-content:center}
.shake{animation:sh .35s}.good .slot{background:var(--ok);color:#fff}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chip{min-width:70px;text-align:center;padding:5px 12px;border-radius:999px;background:var(--card);font-weight:700}.chip.on{background:var(--ok)}
#msg{text-align:center;height:22px;font-weight:700}
#home{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;text-align:center}#home.off{display:none}.logo{display:grid;grid-template-columns:repeat(2,76px);gap:10px}.logo i{height:76px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #aab8c8;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:42px;color:var(--ink)}.logo i:nth-child(2),.logo i:nth-child(3){background:var(--gold);box-shadow:0 5px 0 #c28f00;color:#5a3b00}h1{font-size:34px;margin:0}.go{font-size:24px;padding:12px 44px}
#map{position:fixed;inset:0;background:rgba(6,20,45,.98);display:none;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px}
#map.on{display:flex}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:420px;overflow-y:auto;margin:14px 0}
.lv{aspect-ratio:1;border-radius:14px;border:0;font:inherit;font-weight:800;font-size:20px;background:var(--btn);color:#fff}
.lv.cur{background:var(--gold);color:#5a3b00}.lv.lk{background:rgba(255,255,255,.15);color:#8aa}
.row{flex-wrap:wrap}.row .btn{font-size:14px;padding:8px 10px}
#side{position:fixed;inset:0;z-index:15;background:rgba(6,20,45,.6);display:none}#side.on{display:block}
#panel{position:absolute;top:0;bottom:0;right:0;width:min(78%,320px);background:#e6f2ff;color:var(--ink);padding:calc(24px + env(safe-area-inset-top,0px)) 16px 20px;display:flex;flex-direction:column;gap:12px;border-radius:24px 0 0 24px}
#panel .btn{font-size:18px;padding:14px;width:100%}
#grid{display:block;flex:1;min-height:0}.lv{position:absolute;width:52px;height:52px;aspect-ratio:auto;border-radius:50%;transform:translateX(-50%);box-shadow:0 4px 0 var(--btn2)}
.lv.done{background:var(--ok);box-shadow:0 4px 0 #1e8449}.lv.cur{box-shadow:0 0 0 5px rgba(255,200,61,.4),0 4px 0 #c28f00}
.lv.stn{width:66px;height:66px;font-size:30px;background:#9b59f6;box-shadow:0 4px 0 #6c3bb8}.lv.lk{background:rgba(255,255,255,.18);box-shadow:none}
a.btn{display:block;text-decoration:none;text-align:center;color:#fff}
#share{position:fixed;inset:0;z-index:25;background:rgba(6,20,45,.7);display:none;align-items:center;justify-content:center;padding:20px}#share.on{display:flex}
#shbox{position:relative;background:#e6f2ff;color:var(--ink);border-radius:28px;padding:22px 18px 20px;width:100%;max-width:360px;text-align:center;border:4px solid #fff}
#shbox h2{margin:0;font-size:24px}#shbox p{margin:2px 0 8px;font-weight:700;opacity:.75}
#shx{position:absolute;top:10px;left:14px;border:0;background:none;font-size:22px;color:var(--ink)}
#shbox .logo{grid-template-columns:repeat(2,56px);justify-content:center;margin:10px auto}#shbox .logo i{height:56px;font-size:30px;border-radius:14px}
.soc{display:flex;justify-content:center;gap:14px;margin-top:14px}
.c{width:60px;height:60px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font:inherit;font-weight:800;font-size:28px;color:#fff;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.fb{background:#3b5998}.wa{background:#25d366}.ig{background:#d6249f}.mo{background:#9b59f6}
#shm{min-height:22px;margin-top:12px;font-weight:700;font-size:14px;word-break:break-all}
#ver{margin-top:auto;text-align:center;font-size:13px;font-weight:700;opacity:.6}
#accs{text-align:center;font-size:13px;font-weight:700;opacity:.75;margin-top:-6px}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <button class="btn" id="set" aria-label="الإعدادات">⚙️</button>
  <div class="pill" id="lvl">المرحلة 1</div>
  <div class="pill">🪙 <span id="coins">50</span></div>
  <button class="btn" id="mapb">🗺️</button>
 </div>
 <div class="pic" id="pic"></div>
 <div class="row" id="found"></div>
 <div id="msg"></div>
 <div class="slots" id="slots"></div>
 <div class="keys" id="keys"></div>
 <div class="row"><button class="btn gold" id="hint">💡 تلميح (10)</button><button class="btn" id="clear">🗑️ مسح</button></div>
</div>
<div id="home"><div class="logo"><i>خ</i><i>م</i><i>ن</i><i>؟</i></div><h1>خمّن الكلمة بالصورة</h1><button class="btn gold go" id="play">ابدأ اللعب</button></div>
<div id="share"><div id="shbox"><button id="shx" aria-label="إغلاق">✖</button><h2>انشر اللعبة</h2><p>وتحدَّ أصحابك!</p><div class="logo"><i>خ</i><i>م</i><i>ن</i><i>؟</i></div><div class="soc"><a id="sfb" class="c fb" target="_blank" rel="noopener">f</a><a id="swa" class="c wa" target="_blank" rel="noopener">💬</a><a id="sig" class="c ig" href="https://www.instagram.com/" target="_blank" rel="noopener">📷</a><button id="smo" class="c mo">⋯</button></div><div id="shm"></div></div></div>
<div id="side"><div id="panel"><h2 style="margin:0 0 4px;text-align:center">الإعدادات</h2><button class="btn" id="gs"></button><div id="accs"></div><button class="btn" id="snd"></button><button class="btn" id="shr">📤 أرسل اللعبة</button><a class="btn" id="ig" style="display:none" target="_blank" rel="noopener">📷 تابعنا</a><button class="btn gold" id="hm">🏠 الرئيسية</button><div id="ver">الإصدار 1.6</div></div></div>
<div id="map"><div class="pill" style="font-size:20px">خريطة المراحل</div><div id="grid"></div><button class="btn" id="close">إغلاق</button></div>
<script>
const L=[["🌞", ["ضوء", "حرارة", "صيف"]], ["🌙", ["ليل", "نجوم", "ظلام"]], ["🍎", ["فاكهة", "شجرة", "عصير"]], ["🚗", ["طريق", "سائق", "محرك"]], ["✈️", ["سماء", "مطار", "سفر"]], ["🏠", ["باب", "سقف", "عائلة"]], ["📚", ["قراءة", "مدرسة", "قلم"]], ["🌹", ["عطر", "حديقة", "حب"]], ["🐟", ["بحر", "شبكة", "ماء"]], ["🦁", ["غابة", "ملك", "زئير"]], ["🐘", ["خرطوم", "ضخم", "عاج"]], ["⏰", ["وقت", "منبه", "نوم"]], ["🐄", ["حليب", "مزرعة", "عجل"]], ["🐔", ["بيض", "ريش", "ديك"]], ["🐝", ["عسل", "خلية", "لسع"]], ["🌧️", ["مطر", "غيوم", "شتاء"]], ["❄️", ["ثلج", "برد", "جليد"]], ["🔥", ["نار", "حرق", "دخان"]], ["🌳", ["ظل", "غصن", "جذع"]], ["🏖️", ["رمل", "شاطئ", "موج"]], ["⚽", ["كرة", "لاعب", "هدف"]], ["🎂", ["حلوى", "شمعة", "عيد"]], ["🦷", ["سن", "طبيب", "تنظيف"]], ["👁️", ["نظر", "رمش", "عدسة"]], ["🎵", ["لحن", "غناء", "نغمة"]], ["🔑", ["قفل", "باب", "خزنة"]], ["💡", ["نور", "كهرباء", "مصباح"]], ["📱", ["اتصال", "شاشة", "رسالة"]], ["🚲", ["عجلة", "سباق", "دواسة"]], ["🚢", ["ميناء", "بحار", "قبطان"]], ["🚂", ["محطة", "ركاب", "سكة"]], ["🍕", ["عجين", "جبن", "مطعم"]], ["☕", ["قهوة", "فنجان", "بخار"]], ["🍉", ["أحمر", "بذور", "عطش"]], ["🎈", ["هواء", "حفلة", "خيط"]], ["🏰", ["ملك", "قلعة", "فارس"]], ["🐢", ["بطيء", "درع", "بيضة"]], ["🦅", ["جناح", "صقر", "قمة"]], ["🌋", ["جبل", "رماد", "انفجار"]], ["🌈", ["ألوان", "قوس", "سبعة"]], ["🧲", ["جذب", "حديد", "قطب"]], ["🔭", ["فلك", "كواكب", "مرصد"]], ["🎹", ["عزف", "مفاتيح", "موسيقى"]], ["🧭", ["اتجاه", "شمال", "خريطة"]], ["🏔️", ["تسلق", "ثلوج", "صخور"]], ["🛰️", ["فضاء", "مدار", "أرض"]], ["🧪", ["مختبر", "تجربة", "كيمياء"]], ["⚖️", ["عدالة", "قاضي", "محكمة"]], ["🏆", ["فوز", "بطولة", "كأس"]], ["🎓", ["تخرج", "جامعة", "شهادة"]], ["🍇", ["عصير", "زبيب", "عنقود"]], ["🍊", ["قشر", "فيتامين", "حامض"]], ["🥕", ["أرنب", "خضار", "برتقالي"]], ["🥖", ["مخبز", "طحين", "خميرة"]], ["🥚", ["قشرة", "فطور", "دجاجة"]], ["🍫", ["كاكاو", "حلوى", "بني"]], ["🍦", ["بارد", "قمع", "مثلجات"]], ["🍔", ["شطيرة", "وجبة", "سريعة"]], ["🍞", ["فرن", "قمح", "رغيف"]], ["🥗", ["خس", "طماطم", "خيار"]], ["🐒", ["موز", "غصن", "ذيل"]], ["🐇", ["قفز", "أذن", "جزر"]], ["🐺", ["عواء", "قطيع", "ناب"]], ["🦊", ["مكر", "ذيل", "حيلة"]], ["🐻", ["سبات", "مخلب", "كهف"]], ["🐼", ["خيزران", "صين", "أبيض"]], ["🐧", ["قطب", "جليد", "سباحة"]], ["🐬", ["ذكي", "محيط", "قفز"]], ["🐙", ["أذرع", "حبر", "قاع"]], ["🦀", ["كماشة", "صدفة", "جانبي"]], ["🦋", ["أجنحة", "زهرة", "رحيق"]], ["🕷️", ["خيوط", "أرجل", "فريسة"]], ["🐍", ["سم", "زحف", "لدغ"]], ["🦒", ["رقبة", "طويل", "سافانا"]], ["🦉", ["حكمة", "سهر", "عيون"]], ["🌻", ["أصفر", "حقل", "زيت"]], ["🌵", ["صحراء", "شوك", "جاف"]], ["🍄", ["قبعة", "غابة", "سام"]], ["🌊", ["أمواج", "أزرق", "عميق"]], ["🏝️", ["نخلة", "رمال", "عطلة"]], ["🌅", ["شروق", "أفق", "فجر"]], ["⛈️", ["رعد", "برق", "عاصفة"]], ["🌪️", ["إعصار", "دوامة", "رياح"]], ["🧊", ["مكعب", "تجمد", "ثلاجة"]], ["⛺", ["تخييم", "رحلة", "جبل"]], ["🚁", ["إنقاذ", "هبوط", "مروحة"]], ["🚀", ["إطلاق", "رواد", "مركبة"]], ["🚒", ["إطفاء", "حريق", "سلم"]], ["🚑", ["إسعاف", "مريض", "سرعة"]], ["🚓", ["شرطة", "دورية", "قانون"]], ["🛵", ["دراجة", "خوذة", "توصيل"]], ["⛽", ["وقود", "بنزين", "مضخة"]], ["🏥", ["دكتور", "علاج", "طوارئ"]], ["🏫", ["تعليم", "معلم", "طلاب"]], ["🕌", ["صلاة", "مئذنة", "جامع"]], ["🏪", ["بيع", "شراء", "زبون"]], ["🏦", ["مال", "حساب", "صراف"]], ["🌉", ["نهر", "عبور", "معلق"]], ["🎡", ["دولاب", "ملاهي", "دوران"]], ["🥇", ["ذهب", "ميدالية", "بطل"]], ["⌚", ["ذكية", "توقيت", "سوار"]], ["💻", ["حاسوب", "لوحة", "برمجة"]], ["🖨️", ["ورق", "حبر", "نسخة"]], ["📷", ["تصوير", "عدسة", "لقطة"]], ["🎥", ["سينما", "فيلم", "مخرج"]], ["🎤", ["صوت", "مغني", "حفل"]], ["🎸", ["أوتار", "عزف", "فرقة"]], ["🥁", ["إيقاع", "عصا", "ضرب"]], ["🎨", ["فنان", "ريشة", "رسم"]], ["🧵", ["خياطة", "إبرة", "قماش"]], ["✂️", ["قصة", "حلاقة", "شعر"]], ["🔨", ["نجار", "مسمار", "بناء"]], ["🔧", ["مفتاح", "ورشة", "سباك"]], ["🧹", ["تنظيف", "غبار", "كنس"]], ["🛏️", ["وسادة", "غطاء", "غرفة"]], ["🚿", ["استحمام", "ماء", "صابون"]], ["🪞", ["انعكاس", "زجاج", "وجه"]], ["🔬", ["تكبير", "عينة", "جراثيم"]], ["🧬", ["جينات", "وراثة", "خلية"]], ["💊", ["دواء", "صيدلية", "شفاء"]], ["🩺", ["فحص", "نبض", "سماعة"]], ["🧠", ["تفكير", "ذكاء", "ذاكرة"]], ["❤️", ["شريان", "عاطفة", "شعور"]], ["🦴", ["هيكل", "كسر", "جمجمة"]], ["🌍", ["كوكب", "عالم", "قارات"]], ["🪐", ["زحل", "حلقات", "مجرة"]], ["☄️", ["نيزك", "صخرة", "اصطدام"]], ["🌠", ["شهاب", "أمنية", "سقوط"]], ["🌌", ["كون", "مجرات", "اتساع"]], ["⚡", ["طاقة", "صاعقة", "كهرباء"]], ["🔋", ["شحن", "هاتف", "سريع"]], ["🔌", ["مقبس", "تيار", "سلك"]], ["🔒", ["حماية", "مغلق", "سر"]], ["📜", ["لفافة", "تاريخ", "كتابة"]], ["🗿", ["حجر", "حضارة", "منحوت"]], ["🏛️", ["أعمدة", "إغريق", "معبد"]], ["⚓", ["سفينة", "رسو", "ثقيلة"]], ["🗼", ["برج", "باريس", "حديد"]], ["🕋", ["حجاج", "مكة", "طواف"]], ["🌴", ["تمر", "نخيل", "جريد"]], ["🐎", ["فرس", "صهيل", "سرج"]], ["🦚", ["ريش", "جمال", "استعراض"]], ["🦜", ["تقليد", "كلام", "ملون"]], ["🐋", ["محيط", "زعنفة", "نافورة"]], ["🦈", ["أنياب", "افتراس", "خطر"]], ["🐊", ["نهر", "مفترس", "زواحف"]], ["🦎", ["جدار", "زاحف", "ذيل"]], ["🐜", ["مستعمرة", "صغير", "سكر"]], ["🪔", ["رمضان", "شمعة", "نور"]], ["🎖️", ["وسام", "شرف", "جندي"]]];
const AR="ابتثجحخدذرزسشصضطظعغفقكلمنهوي";
let S={lv:0,coins:50,max:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("wg")||"{}"))}catch(e){}
let U=null,db=null,auth=null,fbOK=true,pt;
const saveLocal=()=>{try{localStorage.setItem("wg",JSON.stringify(S))}catch(e){}};
const push=()=>{if(!U||!db)return;clearTimeout(pt);pt=setTimeout(()=>{db.collection("users").doc(U.uid).set({lv:S.lv,max:S.max,coins:S.coins,mute:!!S.mute,t:S.t||Date.now()},{merge:true}).catch(()=>{})},1200)};
const save=()=>{S.t=Date.now();saveLocal();push()};
const $=i=>document.getElementById(i);
let ans,tiles,slots,lock,busy,wi=0,sk=false;
let ac;function beep(f,d=.12){if(S.mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(t){$("msg").textContent=t}
function load(){
 busy=false;sk=false;ans=[...L[S.lv][1][wi]];say("");
 let pool=[...ans];const extra=[...AR].filter(c=>!ans.includes(c)).sort(()=>Math.random()-.5);
 const tot=Math.min(16,ans.length+2+Math.floor(S.lv*.3));while(pool.length<tot)pool.push(extra.pop());
 tiles=pool.sort(()=>Math.random()-.5);slots=ans.map(()=>null);lock=ans.map(()=>false);
 $("pic").textContent=L[S.lv][0];$("lvl").textContent="المرحلة "+(S.lv+1)+" · كلمة "+(wi+1)+"/3";draw();
}
function draw(){
 $("coins").textContent=S.coins;
 $("found").innerHTML=L[S.lv][1].map((w,k)=>`<span class="chip ${k<wi?"on":""}">${k<wi?w:"؟"}</span>`).join("");

 $("slots").innerHTML=slots.map((t,i)=>`<button class="slot ${t!==null?"f":""} ${lock[i]?"lock":""}" data-i="${i}">${t!==null?tiles[t]:""}</button>`).join("");
 $("keys").innerHTML=tiles.map((c,i)=>`<button class="key ${slots.includes(i)?"used":""}" data-t="${i}">${c}</button>`).join("");
}
function check(){
 if(slots.some(t=>t===null))return;
 if(slots.every((t,i)=>tiles[t]===ans[i])){
  busy=true;if(!sk)S.coins+=5;save();
  $("slots").classList.add("good");say(sk?"تم التخطي":"أحسنت! +5 🪙");beep(660);setTimeout(()=>beep(880),120);
  setTimeout(()=>{if(wi<2){wi++}else{wi=0;S.coins+=10;S.lv=(S.lv+1)%L.length;if(S.lv>S.max)S.max=S.lv}save();load()},1000);
 }else{
  busy=true;$("slots").classList.add("shake");say("إجابة خاطئة، حاول مجدداً");beep(180,.25);
  setTimeout(()=>{slots=slots.map((t,i)=>lock[i]?t:null);busy=false;say("");draw()},600);
